<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Entry</title>
    <meta name="description" content="Enter a code and check if it matches the expected value." />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="index.css" />
</head>
<body>
    <main class="container">
        <section class="card">
            <h1>Enter Code</h1>
            <input type="text" id="codeInput" placeholder="Enter code here" autocomplete="off" />
            <button id="checkBtn">Check</button>
            <p id="result" class="result"></p>
        </section>
    </main>
    <script>
        const expected = "MOS49";
        const input = document.getElementById('codeInput');
        const btn = document.getElementById('checkBtn');
        const result = document.getElementById('result');
        btn.addEventListener('click', () => {
            const val = input.value.trim();
            if (!val) {
                result.textContent = "Please enter a code.";
                result.style.color = "#ff6b6b";
                return;
            }
            if (val === expected) {
                result.textContent = "✅ Code correct!";
                result.style.color = "#4caf50";
            } else {
                result.textContent = `❌ Incorrect. Expected "${expected}".`;
                result.style.color = "#ff6b6b";
            }
        });
    </script>
</body>
</html>
