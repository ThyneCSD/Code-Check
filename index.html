<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gateway Verification</title>
    <meta name="description" content="Secure Gateway Code Verification." />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="index.css" />
</head>
<body>
    <main class="page-wrapper">
        <section class="portal-container">
            <div class="portal-header">
                <div class="portal-logo" aria-hidden="true">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                </div>
                <h1>System Verification</h1>
                <p>Please enter your credentials to verify authorization status.</p>
            </div>

            <form id="verificationForm" autocomplete="off">
                <div class="form-control">
                    <label for="codeInput">Security Code</label>
                    <input
                        type="password"
                        id="codeInput"
                        placeholder="••••••••"
                        autocomplete="off"
                        spellcheck="false"
                        required
                    />
                </div>

                <button type="submit" id="submitBtn">
                    <span class="btn-text">Verify Access</span>
                    <span class="btn-loader" hidden>Verifying...</span>
                </button>
            </form>

            <div id="statusAlert" class="alert-box" hidden>
                <div class="alert-icon" id="alertIcon"></div>
                <div class="alert-content">
                    <h2 id="alertTitle"></h2>
                    <p id="alertMessage"></p>
                </div>
            </div>

            <div class="portal-footer">
                <p>Protected System. Access restricted to authorized personnel only.</p>
            </div>
        </section>
    </main>

    <script>
        // SHA-256 implementation
        async function sha256(message) {
            const encoder = new TextEncoder();
            const data = encoder.encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        let expectedHash = '';
        (async () => {
            expectedHash = await sha256('MOS49');
        })();

        const form = document.getElementById('verificationForm');
        const input = document.getElementById('codeInput');
        const btn = document.getElementById('submitBtn');
        const btnText = btn.querySelector('.btn-text');
        const btnLoader = btn.querySelector('.btn-loader');
        const alertBox = document.getElementById('statusAlert');
        const alertIcon = document.getElementById('alertIcon');
        const alertTitle = document.getElementById('alertTitle');
        const alertMessage = document.getElementById('alertMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const value = input.value.trim();

            if (!value) return;

            btnText.hidden = true;
            btnLoader.hidden = false;
            btn.disabled = true;
            alertBox.hidden = true;

            // Short authentic checking delay
            await new Promise(r => setTimeout(r, 600));

            const hashedInput = await sha256(value);

            if (hashedInput === expectedHash) {
                showAlert('success', 'Access Authorized', 'The verification code matches our registry.');
            } else {
                showAlert('error', 'Authentication Failed', 'The code entered is invalid or has expired.');
            }

            btnText.hidden = false;
            btnLoader.hidden = true;
            btn.disabled = false;
        });

        function showAlert(type, title, message) {
            alertBox.hidden = false;
            alertBox.className = 'alert-box alert-' + type;

            const icons = {
                success: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
                error: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'
            };

            alertIcon.innerHTML = icons[type] || '';
            alertTitle.textContent = title;
            alertMessage.textContent = message;
        }
    </script>
</body>
</html>
