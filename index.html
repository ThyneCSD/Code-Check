<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="index.css" />
</head>
<body>
    <main class="container">
        <!-- Card panel -->
        <div class="card" id="cardPanel">
            
            <!-- View 1: Verification Form -->
            <div id="verifyView">
                <h2>Enter Code</h2>
                <p class="subtitle">Please enter the security code to proceed.</p>
                
                <form id="codeForm" autocomplete="off">
                    <div class="form-group">
                        <input 
                            type="password" 
                            id="codeInput" 
                            placeholder="Enter code" 
                            required 
                            autocomplete="off"
                            spellcheck="false"
                        />
                    </div>
                    <button type="submit" id="submitBtn">Verify</button>
                </form>
                <p id="errorMsg" class="error-message"></p>
            </div>

            <!-- View 2: Congratulations Page (shown on success) -->
            <div id="congratsView" class="hidden">
                <div class="success-icon">🎉</div>
                <h2>Success!</h2>
                <p class="congrats-text">Congratulations, the code is correct!</p>
                <div class="decoration-dots">
                    <span></span><span></span><span></span>
                </div>
            </div>

        </div>
    </main>

    <script>
        // SHA-256 function to hash code
        async function sha256(message) {
            const encoder = new TextEncoder();
            const data = encoder.encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        let expectedHash = '';
        (async () => {
            expectedHash = await sha256('MOS49');
        })();

        const form = document.getElementById('codeForm');
        const input = document.getElementById('codeInput');
        const submitBtn = document.getElementById('submitBtn');
        const errorMsg = document.getElementById('errorMsg');
        
        const verifyView = document.getElementById('verifyView');
        const congratsView = document.getElementById('congratsView');
        const cardPanel = document.getElementById('cardPanel');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const val = input.value.trim();

            if (!val) return;

            errorMsg.textContent = '';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Checking...';

            const hashedInput = await sha256(val);

            if (hashedInput === expectedHash) {
                // Show congratulations page
                verifyView.classList.add('hidden');
                congratsView.classList.remove('hidden');
                cardPanel.classList.add('success-state');
            } else {
                errorMsg.textContent = 'Incorrect code. Please try again.';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Verify';
                input.value = '';
                input.focus();
            }
        });
    </script>
</body>
</html>
